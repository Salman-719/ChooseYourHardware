version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      HARDWARE_DB_PATH: metadata_extractor/metadata_extractor/app/hardware.db
      HARDWARE_FEED_URL: ${HARDWARE_FEED_URL:-https://www.techpowerup.com/gpu-specs/}
    volumes:
      - backend_data:/app/src/metadata_extractor/metadata_extractor/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: Frontend/northlane-partner-hub
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
*** End Patch
